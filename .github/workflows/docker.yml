name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prisma-migrations:
    name: Prisma schema check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prisma_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if schema.prisma has no matching migration
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/prisma_shadow
          PRISMA_SHADOW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prisma_shadow
        run: pnpm db:check

  deploy:
    name: Deploy
    needs: prisma-migrations
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_REALTIME_URL: ${{ secrets.NEXT_PUBLIC_REALTIME_URL || secrets.NEXT_PUBLIC_API_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NOTIFICATION_BROADCAST_URL: ${{ secrets.NOTIFICATION_BROADCAST_URL }}
          NOTIFICATION_APPLICATION_ID: ${{ secrets.NOTIFICATION_APPLICATION_ID }}
          ETRADE_REGISTRATION_URL: ${{ secrets.ETRADE_REGISTRATION_URL }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: NEXT_PUBLIC_API_URL,NEXT_PUBLIC_REALTIME_URL,APP_URL,JWT_SECRET,POSTGRES_PASSWORD,NOTIFICATION_BROADCAST_URL,NOTIFICATION_APPLICATION_ID,ETRADE_REGISTRATION_URL,SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD
          script_stop: true
          request_pty: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/app
            git pull origin main

            # Generate the server .env dynamically from GitHub Secrets
            cat <<EOF > .env
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_REALTIME_URL=$NEXT_PUBLIC_REALTIME_URL
            APP_URL=$APP_URL
            JWT_SECRET=$JWT_SECRET
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            NOTIFICATION_BROADCAST_URL=$NOTIFICATION_BROADCAST_URL
            NOTIFICATION_APPLICATION_ID=$NOTIFICATION_APPLICATION_ID
            ETRADE_REGISTRATION_URL=$ETRADE_REGISTRATION_URL
            SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            EOF

            # Build and deploy all services
            docker compose up -d --build --remove-orphans
