name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_API_URL APP_URL JWT_SECRET POSTGRES_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Add repository secret $name (Settings → Secrets and variables → Actions)." >&2
              missing=1
            fi
          done
          exit $missing

      - name: Build images
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_REALTIME_URL: ${{ secrets.NEXT_PUBLIC_REALTIME_URL || secrets.NEXT_PUBLIC_API_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose build
