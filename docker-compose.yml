services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - /home/ehi/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-${NEXT_PUBLIC_API_URL}}
    expose:
      - "3000"
    restart: always
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "4000"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/dispatch_db
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      - UPLOAD_ROOT=/var/smart-dispatch/uploads
      - NOTIFICATION_BROADCAST_URL=${NOTIFICATION_BROADCAST_URL}
      - NOTIFICATION_APPLICATION_ID=${NOTIFICATION_APPLICATION_ID}
      - ETRADE_REGISTRATION_URL=${ETRADE_REGISTRATION_URL}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/var/smart-dispatch/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dispatch_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads: